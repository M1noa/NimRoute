name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go vet -tags ner ./...

      - name: test
        run: go test -race ./...

      - name: test-ner
        run: go test -tags ner ./pii/...

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="dev"
          OUT="nimroute-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && OUT="$OUT.exe"
          go build -trimpath -ldflags "-s -w -X main.versionStr=$VERSION" -o "$OUT" .

      - uses: actions/upload-artifact@v4
        with:
          name: nimroute-${{ matrix.goos }}-${{ matrix.goarch }}
          path: nimroute-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nimroute-*
          merge-multiple: true

      - name: checksums
        run: sha256sum nimroute-* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nimroute-*
            checksums.txt
          generate_release_notes: true
